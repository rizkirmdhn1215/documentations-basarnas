services:
  postgres:
    image: postgres:16
    container_name: basarnas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: basarnas_media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - basarnas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basarnas-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      # Database (use host.docker.internal for external RDS or postgres service name for local)
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-basarnas_media}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: ${DB_SSL:-false}
      # AWS S3
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-supersecret_change_in_production}
    volumes:
      # Persist temp uploads directory
      - temp_uploads:/app/temp_uploads
    depends_on:
      - postgres
    networks:
      - basarnas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: basarnas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - basarnas-network

volumes:
  postgres_data:
  temp_uploads:

networks:
  basarnas-network:
    driver: bridge
